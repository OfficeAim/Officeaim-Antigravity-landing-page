[build]
  # Build the React app inside /hub, then move the built files to the /hub directory
  # so Netlify serves the compiled app instead of the raw source code.
  command = "cd hub && npm install && npm run build && cd .. && cp -R hub/dist/* hub/"
  publish = "."

[functions]
  directory = "netlify/functions"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"

[[redirects]]
  from = "/api/newsletter/send"
  to = "/.netlify/functions/send-newsletter"
  status = 200

[[redirects]]
  from = "/pricing"
  to = "/community.html"
  status = 301

[[redirects]]
  from = "/pricing.html"
  to = "/community.html"
  status = 301

[[redirects]]
  from = "/community"
  to = "/community.html"
  status = 200

[[redirects]]
  from = "/learn"
  to = "/learn.html"
  status = 200

[[redirects]]
  from = "/learn/prompts"
  to = "/learn/prompts.html"
  status = 200

[[redirects]]
  from = "/resources/workflows"
  to = "/resources/workflows.html"
  status = 200

[[redirects]]
  from = "/learn/workflows"
  to = "/resources/workflows.html"
  status = 200

[[redirects]]
  from = "/resources/website-creator"
  to = "/resources/website-creator.html"
  status = 200

[[redirects]]
  from = "/skills"
  to = "/skills.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/hub/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/hub/index.html"
  status = 200

[[redirects]]
  from = "/hub/*"
  to = "/hub/index.html"
  status = 200
