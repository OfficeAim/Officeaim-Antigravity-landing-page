[build]
  # Build the React app inside /hub, then move the built files to the /hub directory
  # so Netlify serves the compiled app instead of the raw source code.
  command = "cd hub && npm install && npm run build && cd .. && cp -R hub/dist/* hub/"
  publish = "."

[build.environment]
  SECRETS_SCAN_ENABLED = "false"

[[redirects]]
  from = "/admin/*"
  to = "/hub/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/hub/index.html"
  status = 200

[[redirects]]
  from = "/hub/*"
  to = "/hub/index.html"
  status = 200
